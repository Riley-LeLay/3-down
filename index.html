<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Down - Card Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen">
        <div class="setup-container">
            <h1>3 Down</h1>
            <div class="setup-form">
                <label for="player-count">Number of Players:</label>
                <select id="player-count">
                    <option value="3">3 Players</option>
                    <option value="4">4 Players</option>
                    <option value="5">5 Players</option>
                </select>
                <div id="player-names">
                    <input type="text" class="player-name" placeholder="Player 1 Name" data-player="0">
                    <input type="text" class="player-name" placeholder="Player 2 Name" data-player="1">
                    <input type="text" class="player-name" placeholder="Player 3 Name" data-player="2">
                </div>
                <button id="start-game-btn">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Swap Phase Screen -->
    <div id="swap-screen" class="screen hidden">
        <div class="swap-container">
            <h2>Swap Phase - <span id="swap-player-name"></span></h2>
            <p class="swap-instructions">Click a hand card, then click a face-up card to swap them.</p>
            <div id="swap-area">
                <div class="swap-section">
                    <h3>Your Hand</h3>
                    <div id="swap-hand-cards" class="swap-cards"></div>
                </div>
                <div class="swap-section">
                    <h3>Face-Up Cards</h3>
                    <div id="swap-faceup-cards" class="swap-cards"></div>
                </div>
                <div class="swap-section">
                    <h3>Face-Down Cards</h3>
                    <div id="swap-facedown-cards" class="swap-cards"></div>
                </div>
            </div>
            <button id="done-swap-btn">Done Swapping</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <!-- Header -->
        <div id="game-header">
            <span id="game-title">3 Down</span>
            <span id="game-status"></span>
            <span id="direction-indicator">↻</span>
        </div>

        <!-- Game Table -->
        <div id="game-table">
            <!-- Top Player -->
            <div id="player-top" class="opponent-area top">
                <div class="opponent-name"></div>
                <div class="opponent-table-cards">
                    <div class="table-cards-row facedown-row"></div>
                    <div class="table-cards-row faceup-row"></div>
                </div>
                <div class="opponent-hand"></div>
            </div>

            <!-- Left Player -->
            <div id="player-left" class="opponent-area left">
                <div class="opponent-name"></div>
                <div class="opponent-table-cards">
                    <div class="table-cards-row facedown-row"></div>
                    <div class="table-cards-row faceup-row"></div>
                </div>
                <div class="opponent-hand"></div>
            </div>

            <!-- Center Table Area -->
            <div id="center-table">
                <div id="deck-area">
                    <div id="draw-pile" class="pile-stack">
                        <div class="card card-back"></div>
                        <span class="pile-count" id="deck-count">0</span>
                    </div>
                </div>
                <div id="play-area">
                    <div id="play-pile"></div>
                    <span class="pile-label" id="pile-count-label">0 cards</span>
                </div>
                <div id="discard-area">
                    <div id="discard-pile" class="pile-stack empty">
                        <span class="pile-count" id="discard-count">0</span>
                    </div>
                </div>
            </div>

            <!-- Right Player -->
            <div id="player-right" class="opponent-area right">
                <div class="opponent-name"></div>
                <div class="opponent-table-cards">
                    <div class="table-cards-row facedown-row"></div>
                    <div class="table-cards-row faceup-row"></div>
                </div>
                <div class="opponent-hand"></div>
            </div>

            <!-- Top-Left Player (for 5 players) -->
            <div id="player-top-left" class="opponent-area top-left hidden">
                <div class="opponent-name"></div>
                <div class="opponent-table-cards">
                    <div class="table-cards-row facedown-row"></div>
                    <div class="table-cards-row faceup-row"></div>
                </div>
                <div class="opponent-hand"></div>
            </div>

            <!-- Top-Right Player (for 5 players) -->
            <div id="player-top-right" class="opponent-area top-right hidden">
                <div class="opponent-name"></div>
                <div class="opponent-table-cards">
                    <div class="table-cards-row facedown-row"></div>
                    <div class="table-cards-row faceup-row"></div>
                </div>
                <div class="opponent-hand"></div>
            </div>

            <!-- Bottom Player (Current Player) -->
            <div id="player-bottom">
                <div class="player-table-cards">
                    <div class="table-cards-row facedown-row" id="my-facedown"></div>
                    <div class="table-cards-row faceup-row" id="my-faceup"></div>
                </div>
                <div id="my-hand"></div>
            </div>
        </div>

        <!-- Action Bar -->
        <div id="action-bar">
            <div id="current-turn">Current Turn: <span id="current-player-name"></span></div>
            <div id="action-buttons">
                <button id="play-btn" disabled>Play</button>
                <button id="pickup-btn">Pick Up</button>
                <button id="thumb-btn" class="hidden">Thumb!</button>
            </div>
            <div id="special-status"></div>
        </div>

        <!-- Message Toast -->
        <div id="message-toast"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
        <div class="gameover-container">
            <h1>Game Over!</h1>
            <div id="rankings"></div>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- Thumb Modal -->
    <div id="thumb-modal" class="modal hidden">
        <div class="modal-content">
            <h2>👍 THUMB!</h2>
            <p>Quick! Click the button!</p>
            <button id="thumb-react-btn">THUMB!</button>
        </div>
    </div>

    <!-- Joker Modal -->
    <div id="joker-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🃏 JOKER!</h2>
            <p><span id="joker-target-name"></span> must defend or pick up!</p>
            <div class="modal-buttons">
                <button id="joker-defend-btn" class="hidden">Play A♠</button>
                <button id="joker-pickup-btn">Pick Up Pile</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
